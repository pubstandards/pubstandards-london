name: Run tests

on:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run linter
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest .
